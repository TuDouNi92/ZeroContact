plugins {
    id "com.gradleup.shadow" version "8.3.11"
}
architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    neoForge "net.neoforged:neoforge:${neoforge_version}"
    // Remove the next line if you don't want to depend on the API
    modApi "dev.architectury:architectury-neoforge:${architectury_version}"
    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive = false }

    compileOnly("io.github.llamalad7:mixinextras-neoforge:0.5.5")
    annotationProcessor("io.github.llamalad7:mixinextras-neoforge:0.5.5")
    implementation("de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}")

    forgeRuntimeLibrary('com.github.FiguraMC.luaj:luaj-jse:3.0.8-figura')
    compileOnly('com.github.FiguraMC.luaj:luaj-jse:3.0.8-figura')
    forgeRuntimeLibrary('org.apache.commons:commons-math3:3.6.1')
    forgeRuntimeLibrary("com.maydaymemory:mae:1.1.4")
    forgeRuntimeLibrary("com.eliotlash.mclib:mclib:20")
    forgeRuntimeLibrary('org.anarres:jcpp:1.4.14')

    modImplementation("top.theillusivec4.curios:curios-neoforge:${curios_version}")
    modImplementation("curse.maven:${tacz_version}")
    modImplementation("software.bernie.geckolib:geckolib-neoforge-1.21.1:${geckolib_version}")
    modImplementation("com.github.mcmodderanchor:simplebedrockmodel:2.6.2-neoforge-mc1.21.1")

//// Endless Ammo compatibility
//    modCompileOnly("curse.maven:tacz-endless-ammo-1166149:8107585")
//    modLocalRuntime("curse.maven:tacz-endless-ammo-1166149:8107585")   dead

//    modCompileOnly files('libs/firstaid-1.20.1-1.1.jar')
//    modCompileOnly files('libs/tacz-firstaid-compat-1.0.0.jar')
//    modLocalRuntime files('libs/firstaid-1.20.1-1.1.jar')
//    modLocalRuntime files('libs/tacz-firstaid-compat-1.0.0.jar')  dead


//    modLocalRuntime files("libs/Jade-1.20.1-Forge-11.12.3.jar")
//    modLocalRuntime files('libs/curtain-mc1.20.1-1.3.2.jar')

//    modLocalRuntime files('libs/embeddium-0.3.31+mc1.20.1 (1).jar')
//    modLocalRuntime files('libs/oculus-mc1.20.1-1.8.0 (1).jar')  use Iris

//    modLocalRuntime('curse.maven:sound-physics-remastered-535489:7032235')
    modCompileOnly("curse.maven:tacz-magazines-1504588:${magazine_version}")
    modLocalRuntime("curse.maven:tacz-magazines-1504588:${magazine_version}")
//    modLocalRuntime('curse.maven:tacz-simple-enemy-1471691:8289695')  dead
//    modLocalRuntime("curse.maven:shoulder-surfing-reloaded-243190:9389661")
//    modLocalRuntime("curse.maven:tacz-gunshot-reverb-1690954:8923504")   dead
    modLocalRuntime("curse.maven:simple-voice-chat-416089:9350472")
    runtimeOnly('curse.maven:kotlin-for-forge-351264:7291067')

}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

tasks.register('buildBuiltinResourceZip', Zip) { zip ->
    archiveFileName = "default_pack.zip"
    destinationDirectory = project(":common").file('src/main/resources/data/zerocontact')
    from(project(":common").file('src/main/resources/data/zerocontact/default_pack'))
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenForge(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}
